<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    (function() {
      var l = window.location;

      // GitHub Pages SPA fallback support
      if (l.search && l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
        return;
      }

      // If someone opens a non-root route directly, redirect back to the app root
      if (l.pathname !== '/' && l.pathname !== '/index.html') {
        var cleanPath = l.pathname.replace(/^\/+|\/+$/g, '');
        var target = '/?/' + cleanPath + l.search + l.hash;
        window.location.replace(target);
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
